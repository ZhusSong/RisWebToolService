name: ristool-ai
services:
  converter:
    build:
      context: ./files
      dockerfile: Dockerfile.converter
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      CONVERTER_ORIGIN: https://ristoolweb.com
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  files:
    build: ./files
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      ONE_API_URL: http://one-api:3000
      PUBLIC_ORIGIN: https://ai.ristoolweb.com
      HISTORY_URL: http://history:3002
      FILES_INTERNAL_SECRET: ${SESSION_SECRET:?Missing session secret}
      ARTIFACT_DIR: /data/artifacts
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_EDIT_BASE_URL: ${IMAGE_EDIT_BASE_URL:-}
      IMAGE_EDIT_API_KEY: ${IMAGE_EDIT_API_KEY:-}
      CONVERTER_ORIGIN: https://ristoolweb.com
    volumes:
      - artifact-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 48
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  history:
    build: ./history
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      ONE_API_URL: http://one-api:3000
      PUBLIC_ORIGIN: https://ai.ristoolweb.com
      FILES_URL: http://files:3003
      FILES_INTERNAL_SECRET: ${SESSION_SECRET:?Missing session secret}
    volumes:
      - history-data:/data
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  one-api:
    image: ${ONE_API_IMAGE:?Run scripts/manage.py init first}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      TZ: Asia/Tokyo
      SESSION_SECRET: ${SESSION_SECRET:?Missing session secret}
      SQLITE_PATH: /data/one-api.db
      SQL_MAX_OPEN_CONNS: "1"
      SQL_MAX_IDLE_CONNS: "1"
      RELAY_TIMEOUT: "300"
    volumes:
      - ./data:/data
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  history-data:
  artifact-data:
