name: ristool-ai
services:
  history:
    build: ./history
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      ONE_API_URL: http://one-api:3000
      PUBLIC_ORIGIN: https://ai.ristoolweb.com
    volumes:
      - history-data:/data
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
  one-api:
    image: ${ONE_API_IMAGE:?Run scripts/manage.py init first}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      TZ: Asia/Tokyo
      SESSION_SECRET: ${SESSION_SECRET:?Missing session secret}
      SQLITE_PATH: /data/one-api.db
      SQL_MAX_OPEN_CONNS: "1"
      SQL_MAX_IDLE_CONNS: "1"
      RELAY_TIMEOUT: "300"
    volumes:
      - ./data:/data
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  history-data:
