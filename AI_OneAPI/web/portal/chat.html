<!doctype html>
<html lang="zh-CN">
<!-- Bump this asset version together when deploying changed chat CSS or scripts. -->
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RISTOOL AI · 聊天</title><link rel="stylesheet" href="/portal/chat.css?v=20261030-2"><script src="/portal/token-picker.js?v=20261030-2" defer></script><script src="/portal/chat-export.js?v=20261030-2" defer></script><script src="/portal/file-tools.js?v=20261030-2" defer></script><script src="/portal/chat.js?v=20261030-2" defer></script></head>
<body>
<aside id="sidebar">
<a class="brand" href="/token" target="_top">RISTOOL <span>AI</span></a>
<button id="clear" class="new-chat">＋ 新对话</button>
<label class="sr-only" for="search">搜索聊天记录</label><input id="search" type="search" placeholder="搜索对话…">
<div class="list-heading">我的对话 <button id="reload-history" aria-label="刷新记录">↻</button></div>
<nav id="sessions" aria-label="聊天记录"></nav><p id="history-status" role="status">正在读取记录…</p>
<a class="account-link" href="/token" target="_top">← 返回个人管理</a>
</aside>
<main>
<header><button id="toggle-sidebar" aria-label="展开或收起聊天记录" aria-expanded="true">☰</button><select id="model" aria-label="选择模型"><option value="gpt-5.6-sol">GPT-5.6 Sol</option><option value="gpt-6-astra">GPT-6 Astra</option></select><span class="header-spacer"></span><button id="retry-save" hidden>重试保存</button><button id="rename">重命名</button><button id="delete-chat">删除对话</button></header>
<div class="settings"><div class="settings-content"><label for="export-format">导出格式</label><select id="export-format"><option value="md">Markdown (.md)</option><option value="json">JSON (.json)</option></select><button id="export-chat" disabled>↓ 导出当前对话</button></div></div>
<details class="settings"><summary>聊天设置 · 我的令牌</summary><div class="settings-content"><select id="token" aria-label="我的令牌"><option value="">正在加载…</option></select><button id="refresh-tokens">刷新令牌</button><button id="more-tokens" disabled>加载更多</button><a href="/token" target="_top">管理令牌</a><span id="token-status" role="status"></span></div></details>
<div id="scroll-area"><section id="welcome"><div class="welcome-icon">✳</div><h1>今天想聊些什么？</h1><p>开始一个问题，或从左侧继续之前的对话。</p><div class="suggestions"><button data-prompt="帮我梳理一个想法">梳理一个想法</button><button data-prompt="帮我解释一段代码">解释一段代码</button><button data-prompt="帮我制定一个学习计划">制定学习计划</button></div></section><div id="conversation" role="log" aria-live="polite"></div></div>
<div class="composer-area"><form id="composer"><div id="attachment-list" aria-label="待发送附件"></div><label class="sr-only" for="prompt">消息</label><textarea id="prompt" rows="2" maxlength="12000" placeholder="拖入文件或图片，再输入指令…" required></textarea><div class="composer-actions"><input id="uploads" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.txt,.md,.csv,.json,.pdf,.docx,.xlsx,.pptx,.zip" hidden><button id="attach-button" type="button" aria-label="添加附件">＋ 附件</button><details id="file-options"><summary>输出选项</summary><label for="work-mode">模式</label><select id="work-mode"><option value="document">AI 理解 / 文档处理</option><option value="convert">直接格式转换</option><option value="image">生成 / 编辑图片</option></select><label for="output-format">格式</label><select id="output-format"><option value="text">文字</option><option>txt</option><option>md</option><option>csv</option><option>json</option><option>docx</option><option>xlsx</option><option>pdf</option><option>pptx</option><option>zip</option></select></details><span>Enter 发送 · Shift+Enter 换行</span><button id="stop" type="button" disabled>停止等待</button><button id="send" type="submit">发送 ↑</button></div></form><p id="status" role="status"></p><p id="usage"></p><p class="footnote">最多 4 个附件，单个 5 MiB、总计 8 MiB。生成文件保存 24 小时；输入附件不会保存。AI 回答可能有误，请核实重要信息。</p></div>
</main></body></html>
