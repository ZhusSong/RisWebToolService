# Template for the AI site only. Back up the current ristool-ai file first.
# Requires the existing certificate and /etc/nginx/ristool-ai.htpasswd.
server {
    listen 80;
    server_name ai.ristoolweb.com;
    return 301 https://ai.ristoolweb.com$request_uri;
}
server {
    listen 443 ssl;
    server_name ai.ristoolweb.com;
    ssl_certificate /etc/letsencrypt/live/ai.ristoolweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.ristoolweb.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    limit_req zone=ristool_ai_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn ristool_ai_connections 10;
    limit_conn_status 429;
    root /opt/ristool-ai/web;
    client_max_body_size 256k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Bootstrap gate: intentionally blocks unauthorised visitors, including APIs.
    # Keep until the default admin password is changed and signup is disabled.
    auth_basic "Private AI setup";
    auth_basic_user_file /etc/nginx/ristool-ai.htpasswd;

    # Only this exact API path bypasses Basic Auth. One API verifies the bearer token.
    location = /v1/chat/completions {
        auth_basic off;
        limit_except POST { deny all; }
        client_max_body_size 128k;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 30s;
    }
    location = / {
        add_header Cache-Control "no-store" always;
        try_files /index.html =404;
    }
    location ^~ /portal/ {
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }
}
