# Include only in the existing ristoolweb.com HTTPS server.
server_tokens off;
client_max_body_size 32k;
client_header_timeout 10s;
client_body_timeout 10s;
keepalive_timeout 15s;
send_timeout 30s;
reset_timedout_connection on;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_request_buffering on;

limit_req zone=ristool_page burst=40 nodelay;
limit_req zone=ristool_site burst=100 nodelay;
limit_req zone=ristool_stats burst=10 nodelay;
limit_req zone=ristool_translate burst=5 nodelay;
limit_req zone=ristool_login burst=4 nodelay;
limit_req_status 429;
limit_conn ristool_connections 40;
limit_conn ristool_total_connections 200;
limit_conn_status 429;

# Reuse the existing rotated access.log path. Do not log query strings or bodies.
access_log /var/log/nginx/access.log ristool_timing;

location ~ ^/api/analytics/?$ {
    client_max_body_size 4096;
    error_page 429 = @ristool_rate_error;
    error_page 413 = @ristool_size_error;
    include /etc/nginx/snippets/ristool-proxy.conf;
}
location ~ ^/api/translate/?$ {
    client_max_body_size 32000;
    error_page 429 = @ristool_rate_error;
    error_page 413 = @ristool_size_error;
    include /etc/nginx/snippets/ristool-proxy.conf;
}
location = /api/convert {
    client_max_body_size 7m;
    client_body_timeout 30s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 120s;
    error_page 429 = @ristool_rate_error;
    error_page 413 = @ristool_size_error;
    include /etc/nginx/snippets/ristool-proxy.conf;
}
location @ristool_rate_error {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header Cache-Control no-store always;
    return 429 '{"error":"rateLimited"}';
}
location @ristool_size_error {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 413 '{"error":"requestTooLarge"}';
}
