# Loaded inside nginx.conf's http block via conf.d.
map $uri $ristool_dynamic_ip {
    default $binary_remote_addr;
    ~^/_next/static/ "";
}
map $uri $ristool_dynamic_site {
    default $server_name;
    ~^/_next/static/ "";
}
map "$request_method:$uri" $ristool_stats_ip {
    default "";
    ~^POST:/api/analytics/?$ $binary_remote_addr;
}
map "$request_method:$uri" $ristool_translate_ip {
    default "";
    ~^POST:/api/translate/?$ $binary_remote_addr;
}
# Server Actions can be posted to routes other than the login page.
# The app's credential limiter remains authoritative for login actions.
map "$request_method:$uri" $ristool_login_ip {
    default "";
    ~^POST:/page_admin_login/?$ $binary_remote_addr;
}
limit_req_zone $ristool_dynamic_ip zone=ristool_page:1m rate=20r/s;
limit_req_zone $ristool_dynamic_site zone=ristool_site:1m rate=100r/s;
limit_req_zone $ristool_stats_ip zone=ristool_stats:1m rate=60r/m;
limit_req_zone $ristool_translate_ip zone=ristool_translate:1m rate=20r/m;
limit_req_zone $ristool_login_ip zone=ristool_login:1m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=ristool_connections:1m;
limit_conn_zone $server_name zone=ristool_total_connections:1m;
log_format ristool_timing escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":"$request_time","upstream_connect":"$upstream_connect_time","upstream_header":"$upstream_header_time","upstream_response":"$upstream_response_time","rate":"$limit_req_status","connection":"$limit_conn_status"}';
